  --r:18px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,1.35,.35,1);
  --wrap:1180px;--gutter:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1019;--surface:#111925;--surface-2:#16202e;--field:#0d141e;
    --ink:#edf1f6;--ink-2:#a9b4c4;--ink-3:#7c889b;--danger:#ff8f86;
    --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
    --shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 18px 40px rgba(0,0,0,.45);
    --brand-ink:#3cc2f2;--brand-btn:#0a6fa3;--brand-soft:rgba(0,163,224,.16);

  }

:root[data-theme="dark"]{
  --bg:#0a1019;--surface:#111925;--surface-2:#16202e;--field:#0d141e;
  --ink:#edf1f6;--ink-2:#a9b4c4;--ink-3:#7c889b;--danger:#ff8f86;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 18px 40px rgba(0,0,0,.45);

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{width:100%;max-width:calc(var(--wrap) + 2*var(--gutter));margin:0 auto;padding:0 var(--gutter)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Marque : « Altiservice » écrit, avec l'emblème en exposant comme un ® ---------- */
.wordmark{display:inline-flex;align-items:flex-start;text-decoration:none;font-family:var(--font-display);font-weight:800;letter-spacing:-.025em;line-height:1;white-space:nowrap}
.wm-mark{display:inline-block;width:.42em;height:.42em;margin:.02em 0 0 .07em;background:var(--alti-mark) center/contain no-repeat;flex:none}

/* ---------- Écran d'ouverture ---------- */
#gate{position:fixed;inset:0;z-index:90;display:grid;padding:20px 16px;overflow:auto;background:linear-gradient(160deg,var(--navy-0),var(--navy-2))}
.gate-card{display:flex;flex-direction:column;gap:18px;width:min(420px,100%);padding:28px 24px;border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-3)}
#gate .gate-card{position:relative;margin:auto;animation:fadeUp .6s var(--ease) both}   /* margin:auto : centrée, sans jamais sortir par le haut */
@media (max-height:620px){#gate .gate-card{gap:12px;padding:20px}}
.gate-card .wordmark{font-size:24px;color:var(--ink)}
.gate-card h1{margin:0;font:750 20px var(--font-display);letter-spacing:-.015em}
.gate-pick{position:relative}
.gate-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:2;display:flex;flex-direction:column;margin:0;padding:6px;list-style:none;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-3),inset 0 0 0 1px var(--line);max-height:280px;overflow:auto;animation:fadeUp .2s var(--ease) both}
.gate-list li{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.gate-list li[aria-selected="true"]{background:var(--brand-soft)}
.gate-list li mark{background:none;color:var(--brand-ink)}
.gate-list li.none{cursor:default;font-weight:500;font-size:13.5px;color:var(--ink-3)}
.gate-av{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-btn);color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em}
/* Téléphone en hauteur : le clavier cache le bas de l'écran ; la liste s'ouvre vers le haut, le meilleur nom contre le champ */
@media (max-width:899px) and (max-aspect-ratio:4/3){.gate-list{top:auto;bottom:calc(100% + 6px);flex-direction:column-reverse;max-height:min(280px,36vh)}}
.gate-me{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px 8px 10px;border:0;border-radius:14px;background:var(--surface-2);color:var(--ink);text-align:left;box-shadow:inset 0 0 0 1px var(--line-2);transition:box-shadow .2s,transform .18s var(--spring);animation:fadeUp .3s var(--ease) both}
.gate-me:hover{box-shadow:inset 0 0 0 1px var(--brand)}
.gate-me:active{transform:scale(.98)}
.gate-me .gate-av{width:38px;height:38px;font-size:14px}
.gate-me b{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.gate-me small{flex:none;font-size:13px;font-weight:600;color:var(--brand-ink)}
#gateCode,#gateCode2{text-align:center;font-size:22px;letter-spacing:.2em}
.gate-new,#gateGo{animation:fadeUp .3s var(--ease) both}
#gateGo{min-height:48px;justify-content:center;font-size:15px}
.gate-state .err{color:var(--danger)}
.gate-state{min-height:18px;font-size:12.5px}
.gate-hint{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.gate-note{margin:0;padding:2px 0 2px 10px;border-left:3px solid var(--brand-ink);font-size:13px;line-height:1.45}
.gate-key{display:flex;flex-direction:column;gap:10px}
.gate-alt{align-self:flex-start;padding:0;border:0;background:none;color:var(--brand-ink);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#gateStat{color:var(--ink-3)}
#splash:not(.play){display:none}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--navy-0);transition:opacity .45s var(--ease)}
#splash.out{opacity:0;pointer-events:none}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:26px}
.splash-mark{font-size:clamp(34px,6vw,48px);color:#f2f5f9;transform-origin:top left;animation:bloom .9s var(--ease) both}
.splash-bar{width:200px;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;transition:opacity .25s}
.splash-bar i{display:block;height:100%;width:100%;border-radius:2px;background:#f2f5f9;transform:scaleX(0);transform-origin:left;animation:bar 1.05s .15s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes bar{to{transform:scaleX(1)}}
@keyframes bloom{from{opacity:0;transform:scale(.9);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:12px;border:0;background:var(--surface-2);color:var(--ink);
  font-size:14px;font-weight:600;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .18s var(--spring),background .2s,box-shadow .2s}
.btn:hover{background:var(--surface)}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--brand-btn);color:#fff;box-shadow:none}
.btn.primary:hover{background:color-mix(in srgb,var(--brand-btn) 88%,#000)}
#gateErr.ok{color:var(--brand-ink)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.f{display:flex;flex-direction:column;gap:7px}
.f>span{font-size:13px;font-weight:650;color:var(--ink-2)}
.f .hint{font-size:12.5px;color:var(--ink-3)}
.f .err{font-size:12.5px;color:var(--danger);min-height:0}
.field{width:100%;height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--field);box-shadow:inset 0 0 0 1px var(--line-2);outline:none;font-size:15px;transition:box-shadow .2s}
.field:focus{box-shadow:inset 0 0 0 1px var(--brand),0 0 0 3px var(--brand-soft)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .hero h1 .wi,.fade-up,.reveal{transform:none!important;opacity:1!important}
}
/* Safari sur iPhone zoome sur tout champ écrit en moins de 16 px, et ne dézoome pas ensuite */
@media (hover:none),(pointer:coarse){input:not(#gateCode):not(#gateCode2):not(.cat-input),textarea,select{font-size:16px!important}}
